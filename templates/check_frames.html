<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frame Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .current-frame img {
      max-height: 400px;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <a href="/" class="btn btn-secondary mb-3">⬅ Back to Home</a>

  <h2 class="mb-4">Frame Viewer</h2>

  <!-- Input form -->
  <form id="searchForm" class="row g-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="videoIdInput" class="form-control" placeholder="Video ID (e.g. L30_V009)" required>
    </div>
    <div class="col-md-3">
      <input type="number" id="frameNumInput" class="form-control" placeholder="Frame Number" required>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Tìm</button>
    </div>
  </form>

  <!-- Current frame -->
  <div id="currentFrame" class="card mb-4 current-frame d-none">
    <div class="card-body text-center">
      <div class="d-flex align-items-center justify-content-center">
        <!-- Prev button -->
        <button id="prevFrameBtn" class="btn btn-outline-secondary me-2">⬅ Prev</button>

        <!-- Frame image -->
        <img id="currentFrameImg" class="card-img-top mx-2" alt="Current Frame" style="max-height:300px; width:auto;">

        <!-- Next button -->
        <button id="nextFrameBtn" class="btn btn-outline-secondary ms-2">Next ➡</button>
      </div>

      <div class="mt-3">
        <h5>Video: <span id="currentVideoId"></span></h5>
        <p>Frame: <span id="currentFrameNum"></span></p>
        <p>Script: <span id="currentScript"></span></p>
        <a id="currentWatchUrl" href="#" target="_blank">Watch</a>
      </div>
    </div>
  </div>
</div>

<script>
  let framesMap = new Map();   // map: frame_num (Number) -> frame object
  let frameNums = [];          // sorted array of frame_num (Number)
  let currentFrameNum = null;  // actual frame number currently shown (Number)
  let currentVideoId = null;

  // Fetch helper (giữ nguyên endpoint của bạn)
  function fetchNeighboringFrames(videoId, frameNum) {
    const formData = new FormData();
    formData.append('video_id', videoId);
    formData.append('frame_num', frameNum);
    formData.append('model_type', 'pe_core');

    return fetch('/neighboring_frames', {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      return data.frames || [];
    });
  }

  // Merge frames vào cache (no-duplicates) và sort frameNums
  function mergeFrames(frames) {
    let added = false;
    for (const f of frames) {
      const n = Number(f.frame_num);
      if (!Number.isFinite(n)) continue;
      if (!framesMap.has(n)) {
        framesMap.set(n, f);
        frameNums.push(n);
        added = true;
      }
    }
    if (added) frameNums.sort((a,b) => a - b);
  }

  // Tìm nearest frame nếu requested không tồn tại
  function nearestFrameNum(target) {
    if (frameNums.length === 0) return null;
    let nearest = frameNums[0];
    let bestDiff = Math.abs(nearest - target);
    for (let i = 1; i < frameNums.length; i++) {
      const d = Math.abs(frameNums[i] - target);
      if (d < bestDiff) { bestDiff = d; nearest = frameNums[i]; }
    }
    return nearest;
  }

  // Render theo currentFrameNum
  function renderCurrentFrame() {
    if (currentFrameNum === null) return;
    let frame = framesMap.get(Number(currentFrameNum));
    if (!frame) {
      // requested frame not in cache -> fallback nearest
      const nearest = nearestFrameNum(Number(currentFrameNum));
      if (nearest === null) {
        alert("No frames available");
        return;
      }
      currentFrameNum = nearest;
      frame = framesMap.get(currentFrameNum);
    }

    document.getElementById('currentFrame').classList.remove('d-none');
    document.getElementById('currentFrameImg').src = frame.image_url;
    document.getElementById('currentVideoId').textContent = frame.video_id;
    document.getElementById('currentFrameNum').textContent = frame.frame_num;
    document.getElementById('currentScript').textContent = frame.text || frame.script || "No script available";
    document.getElementById('currentWatchUrl').href = frame.watch_url || "#";
    document.getElementById('currentWatchUrl').textContent = frame.watch_url || "No URL available";

    // Set prev/next enabled state based on sorted frameNums
    const idx = frameNums.indexOf(Number(currentFrameNum));
    document.getElementById('prevFrameBtn').disabled = (idx <= 0);
    document.getElementById('nextFrameBtn').disabled = (idx === -1);

  }

  // Load frames (search)
  function loadFrames(videoId, frameNum) {
    // nếu đổi video, clear cache
    if (currentVideoId !== videoId) {
      framesMap.clear();
      frameNums = [];
      currentVideoId = videoId;
      currentFrameNum = null;
    }

    fetchNeighboringFrames(videoId, frameNum)
      .then(frames => {
        mergeFrames(frames);

        // Nếu server trả đúng frame bạn nhập thì dùng luôn
        if (framesMap.has(Number(frameNum))) {
          currentFrameNum = Number(frameNum);
        } else {
          // nếu không có, chọn nearest để hiển thị (và log để debug)
          currentFrameNum = nearestFrameNum(Number(frameNum));
          console.warn("Requested frame not found in response; showing nearest:", currentFrameNum, frames.map(f=>f.frame_num));
        }
        renderCurrentFrame();
      })
      .catch(err => {
        console.error(err);
        alert("Could not load frames: " + err.message);
      });
  }

  // Form submit
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const videoId = document.getElementById('videoIdInput').value.trim();
    const frameNum = parseInt(document.getElementById('frameNumInput').value.trim(), 10);
    if (!videoId || !Number.isFinite(frameNum)) return alert("Please enter valid video and frame");
    loadFrames(videoId, frameNum);
  });

  // Prev
  document.getElementById('prevFrameBtn').addEventListener('click', function () {
    if (!currentVideoId || currentFrameNum === null) return;
    const idx = frameNums.indexOf(Number(currentFrameNum));

    if (idx > 0) {
      // đã có sẵn frame prev trong cache
      currentFrameNum = frameNums[idx - 1];
      renderCurrentFrame();
      return;
    }

    // Nếu idx === 0 (ở đầu cache) -> fetch thêm trước đó
    const anchor = Number(currentFrameNum) - 1;
    fetchNeighboringFrames(currentVideoId, anchor)
      .then(frames => {
        mergeFrames(frames);
        // tìm lại index của old current, rồi lùi 1
        const newIdx = frameNums.indexOf(Number(currentFrameNum));
        if (newIdx > 0) {
          currentFrameNum = frameNums[newIdx - 1];
        } else {
          // fallback: nếu vẫn không có, chọn smallest available
          currentFrameNum = frameNums[0];
        }
        renderCurrentFrame();
      })
      .catch(err => {
        console.error(err);
        alert("Could not fetch previous frames: " + err.message);
      });
  });

  // Next
  document.getElementById('nextFrameBtn').addEventListener('click', function () {
    if (!currentVideoId || currentFrameNum === null) return;
    const idx = frameNums.indexOf(Number(currentFrameNum));

    if (idx !== -1 && idx < frameNums.length - 1) {
      currentFrameNum = frameNums[idx + 1];
      renderCurrentFrame();
      return;
    }

    // at end -> fetch next batch anchored at current+1
    const anchor = Number(currentFrameNum) + 1;
    const btn = this;
    btn.disabled = true;
    fetchNeighboringFrames(currentVideoId, anchor)
      .then(frames => {
        mergeFrames(frames);
        const newIdx = frameNums.indexOf(Number(currentFrameNum));
        if (newIdx !== -1 && newIdx < frameNums.length - 1) {
          currentFrameNum = frameNums[newIdx + 1];
        } else {
          // fallback: highest available
          currentFrameNum = frameNums[frameNums.length - 1];
        }
        renderCurrentFrame();
      })
      .catch(err => {
        console.error(err);
        alert("Could not fetch next frames: " + err.message);
      })
      .finally(() => btn.disabled = false);
  });
</script>


</body>
</html>
