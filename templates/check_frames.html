<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frame Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .current-frame img {
      max-height: 400px;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div class="container py-4">
  <a href="/" class="btn btn-secondary mb-3">⬅ Back to Home</a>

  <h2 class="mb-4">Frame Viewer</h2>

  <!-- Input form -->
  <form id="searchForm" class="row g-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="videoIdInput" class="form-control" placeholder="Video ID (e.g. L30_V009)" required>
    </div>
    <div class="col-md-3">
      <input type="number" id="frameNumInput" class="form-control" placeholder="Frame Number" required>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Tìm</button>
    </div>
  </form>

  <!-- Current frame -->
  <div id="currentFrame" class="card mb-4 current-frame d-none">
    <div class="card-body text-center">
      <div class="d-flex align-items-center justify-content-center">
        <!-- Prev button -->
        <button id="prevFrameBtn" class="btn btn-outline-secondary me-2">⬅ Prev</button>

        <!-- Frame image -->
        <img id="currentFrameImg" class="card-img-top mx-2" alt="Current Frame" style="max-height:300px; width:auto;">

        <!-- Next button -->
        <button id="nextFrameBtn" class="btn btn-outline-secondary ms-2">Next ➡</button>
      </div>

      <div class="mt-3">
        <h5>Video: <span id="currentVideoId"></span></h5>
        <p>Frame: <span id="currentFrameNum"></span></p>
        <p>Script: <span id="currentScript"></span></p>
        <a id="currentWatchUrl" href="#" target="_blank">Watch</a>
      </div>
    </div>
  </div>
</div>

<script>
  let framesCache = [];
  let currentIdx = 0;

  // Fetch API helper
  function fetchNeighboringFrames(videoId, frameNum) {
    const formData = new FormData();
    formData.append('video_id', videoId);
    formData.append('frame_num', frameNum);
    formData.append('model_type', 'pe_core');

    return fetch('/neighboring_frames', {
      method: 'POST',
      body: formData
    })
      .then(res => res.json())
      .then(data => {
        if (data.error) throw new Error(data.error);
        return data.frames;
      });
  }

  // Render main frame only
  function renderFrames(frames, currentIdx) {
    const current = frames[currentIdx];
    document.getElementById('currentFrame').classList.remove('d-none');
    document.getElementById('currentFrameImg').src = current.image_url;
    document.getElementById('currentVideoId').textContent = current.video_id;
    document.getElementById('currentFrameNum').textContent = current.frame_num;
    document.getElementById('currentScript').textContent = current.text || current.script || "No script available";
    document.getElementById('currentWatchUrl').href = current.watch_url || "#";
    document.getElementById('currentWatchUrl').textContent = current.watch_url || "No URL available";

    // Disable prev/next if out of range
    document.getElementById('prevFrameBtn').disabled = currentIdx <= 0;
    document.getElementById('nextFrameBtn').disabled = false;

  }

  // Load frames
  function loadFrames(videoId, frameNum) {
    fetchNeighboringFrames(videoId, frameNum)
      .then(frames => {
        framesCache = frames;
        const idx = frames.findIndex(f => f.frame_num == frameNum);
        currentIdx = idx === -1 ? 0 : idx;
        renderFrames(frames, currentIdx);
      })
      .catch(err => alert("Could not load frames: " + err.message));
  }

  // Form submit
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const videoId = document.getElementById('videoIdInput').value.trim();
    const frameNum = parseInt(document.getElementById('frameNumInput').value.trim());
    loadFrames(videoId, frameNum);
  });

  // Prev / Next buttons
  document.getElementById('prevFrameBtn').addEventListener('click', function () {
    if (currentIdx > 0) {
      currentIdx--;
      renderFrames(framesCache, currentIdx);
    } else {
      const firstFrame = framesCache[currentIdx];
      fetchNeighboringFrames(firstFrame.video_id, firstFrame.frame_num - 1) // fetch before
        .then(frames => {
          if (frames.length > 0) {
            framesCache = frames;
            // keep same index (0) instead of jumping to last
            renderFrames(framesCache, currentIdx);
          }
        })
        .catch(err => alert("Could not fetch previous frames: " + err.message));
    }
  });


  document.getElementById('nextFrameBtn').addEventListener('click', function () {
    const btn = this;
    btn.disabled = true;

    if (currentIdx < framesCache.length - 1) {
      currentIdx++;
      renderFrames(framesCache, currentIdx);
      btn.disabled = false;
    } else {
      const lastFrame = framesCache[currentIdx];
      fetchNeighboringFrames(lastFrame.video_id, lastFrame.frame_num + 1)
        .then(frames => {
          if (frames.length > 0) {
            framesCache = frames;
            // instead of starting at first, keep same index if available
            if (currentIdx >= framesCache.length) currentIdx = framesCache.length - 1;
            renderFrames(framesCache, currentIdx);
          }
        })
        .catch(err => alert("Could not fetch more frames: " + err.message))
        .finally(() => btn.disabled = false);
    }
  });


</script>
</body>
</html>
